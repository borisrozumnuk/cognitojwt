version: 2
updates:
  # Actions, including the SHA-pinned pypa/gh-action-pypi-publish.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The [build-system] floor stays low on purpose: setuptools >= 76 doesn't
      # install on Python 3.8 (and >= 84 not on 3.9), which are still supported.
      - dependency-name: setuptools
