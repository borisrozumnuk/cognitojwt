# Publishes the package to PyPI when a GitHub release is published.
# The release tag must match cognitojwt.__version__ (e.g. "1.6.0" or "v1.6.0").
# Uses PyPI Trusted Publishing: owner borisrozumnuk, repository cognitojwt,
# workflow python-publish.yml, environment pypi.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    # Must match the environment of the Trusted Publisher configured on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/cognitojwt
    permissions:
      contents: read
      # Trusted Publishing: OIDC token exchanged for a short-lived PyPI token.
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - name: Check release tag matches package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION=$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" cognitojwt/__init__.py)
        if [ -z "$VERSION" ] || [ "${TAG#v}" != "$VERSION" ]; then
          echo "::error::Release tag '$TAG' does not match package version '$VERSION'"
          exit 1
        fi
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Publish package
      # Authenticates via Trusted Publishing (no API token) and uploads
      # PEP 740 attestations.
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
