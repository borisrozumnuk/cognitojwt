name: Tests

on:
  push:
    branches: [master]
  pull_request:
  # Called by python-publish.yml before uploading a release.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # Pinned: Python 3.8/3.9 builds are not available for newer Ubuntu images.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[test]'
    - name: Run tests
      run: |
        python -m coverage run -m pytest -v
        python -m coverage report

  # The oldest versions allowed by setup.py, on the oldest supported Python.
  minimal-dependencies:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: '3.8'
    - name: Install package
      run: |
        python -m pip install --upgrade pip
        python -m pip install 'joserfc==0.9.0' 'requests==2.32.4' 'aiohttp==3.9.4' pytest pytest-asyncio
        python -m pip install --no-deps .
    - name: Run tests
      run: python -m pytest -v

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[sync,async]' 'ruff==0.17.6' 'mypy==2.4.1' types-requests
    - name: Ruff
      run: ruff check .
    - name: Mypy
      run: mypy
